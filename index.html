<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowTop/ブラウトップ ブラウザのスタートページにできる軽量リンク集</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=DotGothic16&family=M+PLUS+1+Code&family=Oswald:wght@300&family=Roboto+Mono:wght@200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<!-- サービス終了画面オーバーレイ -->
<div id="service-ended-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0f172a; color: #f8fafc; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px; box-sizing: border-box;">
  <div style="max-width: 550px;">
    <div style="font-size: 48px; margin-bottom: 20px;">📢</div>
    <h1 style="font-size: 24px; font-weight: bold; margin: 0 0 16px 0;">サービス終了のお知らせ</h1>
    <p style="font-size: 15px; color: #94a3b8; line-height: 1.6; margin: 0 0 24px 0;">
      平素より本サービスをご利用いただき、誠にありがとうございました。<br>
      誠に勝手ながら、本サービスは 2026年11月6日 を持ちまして、すべてのサービスを終了いたしました。<br>
      これまでご愛顧いただきましたユーザー様に、心より御礼申し上げます。
    </p>
    <div style="font-size: 13px; color: #64748b; background: #1e293b; padding: 12px 20px; border-radius: 8px; display: inline-block;">
      今後はぜひ、lifetop.pasidea.spaceをご利用ください。
    </div>
  </div>
</div>
    
    <div class="header-top">
        <div class="settings-trigger-top" onclick="toggleModal()"><span class="material-icons">settings</span></div>
        <div id="clock">00:00</div>
        <div id="greeting">...</div>
        <div class="notice-board" id="notice-area">
            <span class="notice-tag">INFO</span>
            <span id="notice-text">問題が発生しました。</span>
        </div>
    </div>
</header>

<div class="search-container">
    <form action="https://www.google.com/search" method="get" class="search-form">
        <input type="text" name="q" class="search-bar" placeholder="Googleで検索" autocomplete="off">
        <button type="submit" class="search-button"><span class="material-icons">search</span></button>
    </form>
</div>

<div class="container">
    <main><div class="card"><h3>ニュース</h3><ul id="news-list">問題が発生しました。</ul></div></main>
    <aside>
        <div class="card"><h3>ブックマーク</h3><div class="bookmark-grid" id="bookmark-grid"></div><button onclick="addBookmark()" style="margin-top:10px; width:100%; padding:8px; border:1px dashed var(--p); background:none; color:var(--p); border-radius:8px; cursor:pointer;">+ 追加</button></div>
        <div class="card"><h3>Quickメモ</h3><textarea id="memo-area" placeholder="メモは自動保存されます。"></textarea></div>
    </aside>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="toggleModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <h3>表示設定</h3>
        <p style="font-size:0.8rem; color:#666;">テーマカラー / 書体 / 文字色</p>
        <div class="picker" id="theme-colors"></div>
        <div class="picker" id="font-styles"></div>
        <div class="picker" id="font-colors"></div>

        <a href="https://profile.pasidea.space/">◀私が作りました▶</a>
        
        <button onclick="toggleModal()" style="margin-top:20px; width:100%; padding:12px; border-radius:12px; border:none; background:var(--p); color:white; cursor:pointer;">閉じる</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
